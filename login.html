<div class="login-box">

      <path d="M5,52 A45,45 0 0,1 95,52"  stroke="#1a2f5e" stroke-width="9"/>

  <div class="login-sys-code" id="login-sys-code">BRIDGE SAFETY MONITORING</div>
  <div class="login-title"    id="login-title">교량 안전감시 시스템</div>
  <div class="login-subtitle">일일 모니터링 보고서</div>

  <div class="login-sep"></div>

  <div class="login-form">
    <div class="lf-group">
      <label class="lf-label">이메일</label>
      <input type="email" id="login-email" class="login-input" placeholder="name@example.com" autocomplete="email">
    </div>
    <div class="lf-group">
      <label class="lf-label">비밀번호</label>
      <input type="password" id="login-pw" class="login-input" placeholder="••••••••" autocomplete="current-password">
    </div>
    <button class="login-btn" onclick="handleLogin()">시스템 접속</button>
    <div id="login-error" class="login-error"></div>
  </div>
</div>

<div class="login-footer-badge">Seoul Metropolitan Government · Authorized Access Only</div>

<!-- 이름 설정 모달 (로그인 후 이름 미설정 시 표시) -->
<div class="modal-overlay" id="name-setup-overlay">
  <div class="modal-box" style="max-width:360px">
    <div class="modal-header">
      <div class="modal-title">👤 이름 설정</div>
    </div>
    <div class="modal-body">
      <p style="font-size:13px;color:var(--muted);margin-bottom:16px;">보고서와 댓글에 표시될 이름을 입력해주세요.</p>
      <div class="ef-row">
        <label class="ef-label">이름</label>
        <input class="ef-input" id="name-setup-input" placeholder="홍길동"
          onkeydown="if(event.key==='Enter')submitNameSetup()">
      </div>
      <div id="name-setup-error" style="color:#ff6b6b;font-size:12px;margin-top:8px;"></div>
    </div>
    <div class="modal-footer">
      <button class="modal-save" onclick="submitNameSetup()">확인</button>
    </div>
  </div>
</div>
